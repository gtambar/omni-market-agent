version: "3.9"

services:
  omni-market-agent:
    build: .
    container_name: omni-market-agent
    restart: always
    ports:
      - "8080:8080"
    environment:
      - OMNI_HOST=0.0.0.0
      - OMNI_PORT=8080
      - OMNI_REFRESH_SECONDS=180
      - OMNI_LIVE_GOOGLE_FINANCE=true
      - OMNI_FAST_MODEL=gemini-2.5-flash
      - OMNI_REASONING_MODEL=gemini-2.5-pro
    volumes:
      - ./runtime_data:/app/runtime_data
